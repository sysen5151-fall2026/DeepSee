    <radialGradient id="glow" cx="0.18" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#0d766e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0d766e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
