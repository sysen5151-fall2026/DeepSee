<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | DeepSee</title>
  <meta name="theme-color" content="#0d766e">
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f8f7; color: #18323a; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }
    .card { max-width: 460px; background: #fff; border: 1px solid #dbe7e3; border-radius: 18px; padding: 32px; box-shadow: 0 12px 34px rgba(26,62,69,.06); text-align: center; }
    .mark { width: 44px; height: 44px; border-radius: 12px; background: #0d766e; margin: 0 auto 18px; }
    h1 { font-size: 1.35rem; margin: 0 0 10px; letter-spacing: -0.02em; }
    p { color: #668087; line-height: 1.6; margin: 0 0 14px; font-size: .95rem; }
    a { display: inline-block; margin-top: 8px; background: #0d766e; color: #fff; padding: 10px 18px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark"></div>
    <h1>The workspace is offline</h1>
    <p>DeepSee could not reach the application server. Locally saved reviews remain on this workstation; no patient data was sent anywhere.</p>
    <p>Reconnect and try again.</p>
    <a href="/">Retry</a>
  </div>
  <script>window.addEventListener('online', function () { window.location.reload(); });</script>
</body>
</html>
