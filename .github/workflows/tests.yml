name: Functional requirement tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  requirements:
    name: F.3 requirement tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Run tests named by requirement ID
        run: python -m pytest tests -v
