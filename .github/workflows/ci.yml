name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck, deployment tests, and builds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/deployment-config.test.cjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Build the workstation-local profile
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_DEPLOYMENT_PROFILE: workstation-local
          NEXT_PUBLIC_API_URL: http://localhost:8000

  backend:
    name: Backend (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q backend/core
